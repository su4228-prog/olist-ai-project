[server]
headless = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#1F2326"
backgroundColor = "#E9EAEC"
secondaryBackgroundColor = "#F3F3F5"
textColor = "#1F2326"
borderColor = "#E3E4E7"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "12px"
buttonRadius = "999px"
baseFontSize = 14
font = "Pretendard:https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css, sans-serif"
headingFontWeights = [500, 500, 600, 600, 600, 600]
headingFontSizes = ["1.6rem", "1.15rem", "1rem", "0.95rem", "0.9rem", "0.85rem"]
metricValueFontSize = "1.9rem"
metricValueFontWeight = 300
chartCategoricalColors = ["#2E70F2", "#FF6D2A", "#8FB0F7", "#FDC3A6", "#9AA0A8"]

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F3F5"
textColor = "#1F2326"
primaryColor = "#1F2326"
