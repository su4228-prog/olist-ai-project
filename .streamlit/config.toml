[server]
headless = true

[client]
toolbarMode = "minimal"   # 상단 Deploy 버튼 숨김 (⋮ 메뉴만 표시)

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#8D7FE6"
backgroundColor = "#F4F5F9"
secondaryBackgroundColor = "#F1F2F7"
textColor = "#23253A"
borderColor = "#E4E6EF"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "12px"
buttonRadius = "999px"
baseFontSize = 14
font = "Pretendard:https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css, sans-serif"
headingFontWeights = [700, 650, 600, 600, 600, 600]
headingFontSizes = ["1.6rem", "1.15rem", "1rem", "0.95rem", "0.9rem", "0.85rem"]
metricValueFontSize = "1.55rem"
metricValueFontWeight = 650
chartCategoricalColors = ["#A8D6F2", "#F8DD88", "#CCC3F6", "#F3AAB7", "#A9ADBE"]

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F5F9"
